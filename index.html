<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="CodeVault - 个人代码保存站，集中管理模板代码、题目代码与云剪贴板片段。" />
  <title>CodeVault · 个人代码保存站</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ============ 顶部栏 ============ -->
  <header class="topbar">
    <div class="topbar-inner">
      <button id="sidebarToggle" class="icon-btn sidebar-toggle" aria-label="切换导航菜单" title="切换导航">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>

      <a href="#" class="brand" id="brandHome">
        <span class="brand-mark">{ }</span>
        <span class="brand-name">CodeVault</span>
        <span class="brand-sub">个人代码保存站</span>
      </a>

      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="searchInput" type="search" placeholder="搜索标题、代码、备注、标签..." autocomplete="off" spellcheck="false" />
        <kbd class="search-kbd">/</kbd>
      </div>

      <div class="topbar-actions">
        <button id="newBtn" class="btn btn-primary">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>新建</span>
        </button>
        <div class="dropdown" id="moreDropdown">
          <button id="moreBtn" class="icon-btn" aria-label="更多操作" title="更多">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>
          </button>
          <div class="dropdown-menu" id="moreMenu" hidden>
            <button data-action="export">导出 JSON 备份</button>
            <button data-action="import">导入 JSON 恢复</button>
            <button data-action="sample">载入示例数据</button>
            <div class="dropdown-divider"></div>
            <button data-action="clear" class="danger">清空所有数据</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="app-shell">
    <!-- ============ 左侧导航 ============ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-scroll">
        <div class="nav-section">
          <div class="nav-title">分类浏览</div>
          <a href="#" class="nav-item active" data-category="all">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="3" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="14" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="14" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
            </span>
            <span class="nav-label">全部代码</span>
            <span class="nav-count" id="countAll">0</span>
          </a>
          <a href="#" class="nav-item" data-category="template">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="m8 6-6 6 6 6M16 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <span class="nav-label">模板代码</span>
            <span class="nav-count" id="countTemplate">0</span>
          </a>
          <a href="#" class="nav-item" data-category="problem">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M9 11a3 3 0 1 1 4.2 2.8c-.8.4-1.2 1.1-1.2 2M12 19h.01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
            </span>
            <span class="nav-label">题目代码</span>
            <span class="nav-count" id="countProblem">0</span>
          </a>
          <a href="#" class="nav-item" data-category="clipboard">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 4V3h6v1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </span>
            <span class="nav-label">其他 / 剪贴板</span>
            <span class="nav-count" id="countClipboard">0</span>
          </a>
        </div>

        <div class="nav-section" id="tagSection">
          <div class="nav-title">标签筛选</div>
          <div id="tagList" class="tag-list"></div>
        </div>

        <div class="nav-section">
          <div class="nav-title">数据管理</div>
          <a href="#" class="nav-item nav-link" data-action="export">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <span class="nav-label">导出 JSON 备份</span>
          </a>
          <a href="#" class="nav-item nav-link" data-action="import">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M12 16V4m0 0 4 4m-4-4L8 8M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <span class="nav-label">导入 JSON 恢复</span>
          </a>
        </div>
      </div>

      <div class="sidebar-footer">
        <span class="dot"></span>
        <span id="storageInfo">本地存储 · 0 条</span>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

    <!-- ============ 主内容区 ============ -->
    <main class="main-content" id="mainContent">
      <div class="content-wrap">
        <div class="page-heading">
          <div>
            <h1 id="pageTitle">全部代码</h1>
            <p id="pageDesc">集中管理你的模板、题目与临时文本片段</p>
          </div>
          <button id="headingNewBtn" class="btn btn-ghost heading-new">+ 新建代码</button>
        </div>

        <!-- 快速粘贴：仅在“其他 / 剪贴板”分类显示 -->
        <section class="quick-paste" id="quickPaste" hidden>
          <div class="quick-paste-head">
            <h2>快速粘贴</h2>
            <span>像云剪贴板一样，贴上就能存</span>
          </div>
          <textarea id="quickPasteInput" rows="3" placeholder="在这里粘贴文本，然后点“保存片段”..." spellcheck="false"></textarea>
          <div class="quick-paste-actions">
            <input id="quickPasteTitle" type="text" placeholder="备注标题（可选）" maxlength="80" />
            <button id="quickPasteSave" class="btn btn-primary">保存片段</button>
          </div>
        </section>

        <div class="filter-bar">
          <div class="filter-chips" id="langChips"></div>
          <div class="result-info" id="resultInfo"></div>
        </div>

        <div class="card-grid" id="cardList"></div>

        <div class="empty-state" id="emptyState" hidden>
          <div class="empty-illustration">
            <svg viewBox="0 0 120 120" width="96" height="96" aria-hidden="true">
              <rect x="24" y="18" width="72" height="84" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
              <path d="M40 44h40M40 58h30M40 72h36" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
              <circle cx="82" cy="84" r="18" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
              <path d="M76 84h12M82 78v12" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </div>
          <h3 id="emptyTitle">这里还没有代码</h3>
          <p id="emptyDesc">点击右上角「新建」，把第一段代码存进来吧。</p>
          <div class="empty-actions" id="emptyActions">
            <button class="btn btn-primary" id="emptyActionBtn">新建代码</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- ============ 编辑弹窗 ============ -->
  <div class="modal" id="editorModal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-panel modal-panel-lg">
      <div class="modal-head">
        <h2 id="editorTitle">新建代码</h2>
        <button class="icon-btn" data-close-modal aria-label="关闭弹窗">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <form id="editorForm" class="modal-body" novalidate></form>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-close-modal>取消</button>
        <button class="btn btn-primary" id="editorSubmit" form="editorForm" type="submit">保存</button>
      </div>
    </div>
  </div>

  <!-- ============ 查看完整代码弹窗 ============ -->
  <div class="modal" id="viewModal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-panel modal-panel-lg">
      <div class="modal-head">
        <h2 id="viewTitle">代码详情</h2>
        <div class="modal-head-actions">
          <button class="btn btn-ghost" id="viewCopyBtn">复制</button>
          <button class="btn btn-ghost" id="viewEditBtn">编辑</button>
          <button class="icon-btn" data-close-modal aria-label="关闭弹窗">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <div class="modal-body" id="viewBody"></div>
    </div>
  </div>

  <!-- ============ 确认弹窗 ============ -->
  <div class="modal" id="confirmModal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-panel modal-panel-sm">
      <div class="modal-head"><h2 id="confirmTitle">确认操作</h2></div>
      <div class="modal-body"><p id="confirmMessage"></p></div>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-close-modal>取消</button>
        <button class="btn btn-danger" id="confirmOk">确认</button>
      </div>
    </div>
  </div>

  <input type="file" id="importFile" accept="application/json,.json" hidden />
  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
